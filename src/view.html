<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAND BY QC</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--card:#fff;--mut:#667;--bd:#d9dde3;--ac:#c2410c;--row:#f3f5f8;--tot:#fff1d6;--sec:#e3eefd;--wk:#fafafb;--hi:#fde9d6;--ok:#15803d;--er:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--fg:#e8eaed;--card:#1e2329;--mut:#9aa3ad;--bd:#343b44;--ac:#fb923c;--row:#252b32;--tot:#3b3016;--sec:#16283f;--wk:#1a1f25;--hi:#3d2a18;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);padding:8px 12px 10px}
.in{max-width:1200px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:19px;margin:0 8px 0 0}
h1 small{font-size:12px;font-weight:500;color:var(--mut);margin-left:6px}
.tabs{display:flex;gap:6px}.tabs button{flex:1}
button,select,input.tx{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;cursor:pointer;min-width:0}
input.tx{cursor:text;width:100%;margin-bottom:8px}
button:hover,select:hover{border-color:var(--ac)}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
main{max-width:1200px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sp{flex:1}
.chip{background:var(--row);border:1px solid var(--bd);border-radius:9px;padding:4px 10px;font-size:13px}.chip b{font-size:15px}
.mut{color:var(--mut);font-size:12px}
.chip.ok{color:var(--ok)}.chip.er{color:var(--er);font-weight:700}
h2{font-size:15px;margin:0 0 10px;color:var(--ac)}
.empty{padding:22px 8px;text-align:center;color:var(--mut)}
#login{max-width:360px;margin:40px auto}
.tabs{overflow-x:auto}.tabs button{flex:1 0 auto}
.lapw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
.lap{min-width:680px;font-size:13px;font-variant-numeric:tabular-nums}
.lap table{border-collapse:collapse;width:100%;margin:0}
.lap td,.lap th{border:1px solid var(--bd);padding:4px 6px;text-align:center;background:var(--card);font-weight:400}
.lap .l{text-align:left}.lap .h,.lap th{background:var(--row);font-weight:700}
.lap .ttl{font-size:17px;text-align:left;color:var(--ac)}
.lap .ok{color:var(--ok);font-weight:700}.lap .rj{color:var(--er);font-weight:700}
.lap select{padding:2px 6px}.lap .gr{padding:6px;border:1px solid var(--bd);background:var(--card);position:sticky;left:0;box-sizing:border-box;width:min(100%,calc(100vw - 52px))}
@media print{header,.bar,.mut{display:none!important}body{background:#fff}.card{border:0;padding:0}.lapw{border:0;overflow:visible}}

/* ---- tampilan HP ---- */
.tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap}
.stw{display:flex;gap:6px;align-items:center;margin-left:auto}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.mk div{background:var(--row);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:0}
.mk span,.rs small{display:block;font-size:11px;color:var(--mut)}
.mk b{font-size:14px;overflow-wrap:anywhere}.mk .w2{grid-column:1/-1}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:2px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;text-align:center}
.rs.ok{border-color:var(--ok)}.rs.rj{border-color:var(--er)}
.rs b{font-size:22px}
.rs .w2,.rs .bd{grid-column:1/-1}.rs .bd{font-weight:700;font-size:15px;padding:6px;border-radius:8px;background:var(--row)}
.rs.ok .bd{color:var(--ok)}.rs.rj .bd{color:var(--er)}
.mt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.mt th,.mt td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}
.mt th{font-size:11px;color:var(--mut);font-weight:600;background:var(--row)}
.mt th:first-child,.mt td:first-child{text-align:left;padding-left:8px;font-weight:600}
.mt td.sp2{color:var(--mut);font-size:12px}
.mt tr.tt td{background:var(--tot);font-weight:700}
.mc{width:100%;border:1px solid var(--bd);border-radius:8px;padding:4px;margin-top:10px;background:var(--card)}
h3.sub{font-size:13px;color:var(--ac);margin:14px 0 2px}
.kr{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--bd);align-items:baseline;font-size:14px}
.kr span{min-width:0}.kr small{display:block;color:var(--mut);font-size:11px}.kr b{white-space:nowrap}
@media(max-width:700px){
 header{padding:6px 8px 8px}
 .top{display:grid;grid-template-columns:40px 1fr 1fr 40px;gap:6px;margin-bottom:6px}
 h1{grid-column:1/3;margin:0;font-size:17px;align-self:center}
 .stw{grid-column:3/5;justify-self:end;min-width:0}
 .stw .chip{font-size:11px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
 .top select{width:100%}
 main{padding:8px}.card{padding:10px}
 .bar button{flex:1}
}
@media print{.stw{display:none}}

/* ---- kartu info (tampilan PC): menggantikan kop form di layar, kop asli tetap untuk cetak ---- */
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:10px}
.kc{background:var(--row);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-width:0}
.kc span,.kt small{display:block;font-size:11px;color:var(--mut)}
.kc b{font-size:15px;overflow-wrap:anywhere}.kc select{margin-top:2px;max-width:100%}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;border:2px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:12px;text-align:center}
.kb.ok{border-color:var(--ok)}.kb.rj{border-color:var(--er)}
.kv{grid-column:1/-1;font-size:18px;font-weight:700;padding:8px;border-radius:8px;background:var(--row)}
.kb.ok .kv{color:var(--ok);background:rgba(21,128,61,.12)}.kb.rj .kv{color:var(--er);background:rgba(185,28,28,.14)}
.kt{padding:4px 6px;min-width:0}.kt b{display:block;font-size:22px;line-height:1.25}.kt.bad b{color:var(--er)}
.ft{margin-top:14px;padding-top:10px;border-top:1px solid var(--bd);text-align:center}
.ft p{margin:0}.ft .wr{font-size:12px;color:var(--er);font-weight:500;line-height:1.5}
.ft .cp{margin-top:8px;font-size:11px;color:var(--mut);font-weight:600}
@media print{.ft{display:none}}
.hdp{display:none}
@media print{.kp,.kb{display:none!important}.hdp{display:block}}


/* ---- tab RB (report bulanan) ---- */
.rbw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
.rb{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.rb th,.rb td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:5px 3px;min-width:38px;text-align:center;background:var(--card);font-weight:400;white-space:nowrap}
.rb thead th{background:var(--row);font-weight:700;line-height:1.2}
.rb small{display:block;font-size:10px;font-weight:400;color:var(--mut)}
.rb .s1{position:sticky;left:0;z-index:2;min-width:66px;text-align:left;padding-left:8px;background:var(--row);font-weight:700;border-right:2px solid var(--bd)}
.rb td.lb{background:var(--wk)}.rb th.lb{color:var(--er)}
.rb .gh th,.rb .gh td{background:var(--sec);color:var(--ac);font-weight:700;text-align:left;padding:6px 8px}
.rb .gh td{padding:0}
.rb .rr td{font-weight:700;font-size:11px}
.rb .rr td.ok{color:var(--ok);background:rgba(21,128,61,.12)}
.rb .rr td.rj{color:var(--er);background:rgba(185,28,28,.14)}
.rb .rr td.li{color:var(--mut);font-weight:400;font-size:10px}
.rb td.bad{color:var(--er);font-weight:700}
.rb .av{background:var(--row);font-weight:700;border-left:2px solid var(--bd);min-width:46px}
.rb td:last-child,.rb th:last-child{border-right:0}
@media print{.rbw{border:0;overflow:visible}.rb{font-size:8px}.rb th,.rb td{min-width:0;padding:2px 1px}.rb .s1{position:static;min-width:0}}
</style><!-- TEMA-INDEX:BEGIN -->
<style>
/* ===== TEMA INDEX: disamakan dengan index.html (palet --p*, kartu beraksen, gaya kartu html[data-cs]) ===== */
:root{--pbg:#000;--pc1:#0f0f0f;--pc2:#1b1b1b;--pbd:#333;--pfg:#f2f5fa;--pmu:#aab4c4;--pdim:#5a606b;--pac:#fb923c;--pon:#000;--pa2:#2563eb;--pon2:#fff;--pt:rgba(242,245,250,.08);--pt2:rgba(242,245,250,.15);--psd:rgba(0,0,0,.6);--psl:rgba(255,255,255,.07)}

html body{background:var(--pbg);color:var(--pfg)}

html body header{background:linear-gradient(160deg,color-mix(in srgb,var(--pac) 12%,var(--pc1)),var(--pc1));border-bottom:1px solid var(--pbd);box-shadow:0 6px 18px var(--psd)}
html body h1{color:var(--pfg);letter-spacing:.04em;font-weight:800}
html body h1 small{color:var(--pmu)}
/* kartu: latar gelap + semburat aksen + garis aksen di atas (seperti kartu Beranda index) */
html body .card{background:linear-gradient(150deg,color-mix(in srgb,var(--pac) 13%,transparent),transparent 62%),var(--pc1);border:1px solid var(--pbd);border-top:4px solid var(--pac);border-radius:14px;box-shadow:inset 0 1px 0 var(--pt2),0 8px 24px var(--psd);color:var(--pfg)}
html body .kc,html body .kb,html body .rs,html body .scg{background:linear-gradient(150deg,color-mix(in srgb,var(--pac) 10%,transparent),transparent 62%),var(--pc1);border-color:var(--pbd);border-radius:12px;box-shadow:inset 0 1px 0 var(--pt2)}
html body .kb.ok,html body .rs.ok{border-color:var(--ok)}
html body .kb.rj,html body .rs.rj{border-color:var(--er)}
html body .chip,html body .mk div{background:var(--pc2);border-color:var(--pbd);color:var(--pfg)}
html body .chip.ok{color:var(--ok)}html body .chip.er{color:var(--er)}
/* tombol & isian */
html body input,html body select,html body button{background:var(--pc2);color:var(--pfg);border-color:var(--pbd)}
html body button.dng{color:var(--er)}
html body button.on,html body button.pri{background:var(--pac);color:var(--pon);border-color:var(--pac)}
html body button:hover,html body select:hover{border-color:var(--pac)}
html body .mut,html body label{color:var(--pmu)}
html body #sbo .sbc,html body #login .card{background:var(--pc1);color:var(--pfg);border-color:var(--pbd)}

/* ===== GAYA KARTU (hanya CSS; atribut html[data-cs] diatur dari index.html) ===== */
html[data-cs=tonal] body .card{background:color-mix(in srgb,var(--pac) 9%,var(--pc1))}
html[data-cs=tonal] body .kc,html[data-cs=tonal] body .kb,html[data-cs=tonal] body .rs,html[data-cs=tonal] body .scg{background:color-mix(in srgb,var(--pac) 16%,var(--pc1))}
html[data-cs=tonal] body .tabs button:not(.on){background:color-mix(in srgb,var(--pac) 18%,var(--pc2));border-radius:10px}
/* ketupat & potong sudut: kartu besar memakai potongan sudut kecil agar isi tabel tidak terpotong */
html[data-cs=ketupat] body .card,html[data-cs=potong] body .card{--k:12px;clip-path:polygon(0 0,calc(100% - var(--k)) 0,100% var(--k),100% 100%,var(--k) 100%,0 calc(100% - var(--k)));border-radius:0}
html[data-cs=ketupat] body .kc,html[data-cs=ketupat] body .kb,html[data-cs=ketupat] body .rs,html[data-cs=ketupat] body .scg{--k:14px;clip-path:polygon(var(--k) 0,calc(100% - var(--k)) 0,100% 50%,calc(100% - var(--k)) 100%,var(--k) 100%,0 50%);border-radius:0;padding-left:calc(12px + var(--k)*.5);padding-right:calc(12px + var(--k)*.5)}
html[data-cs=potong] body .kc,html[data-cs=potong] body .kb,html[data-cs=potong] body .rs,html[data-cs=potong] body .scg{--k:12px;clip-path:polygon(0 0,calc(100% - var(--k)) 0,100% var(--k),100% 100%,var(--k) 100%,0 calc(100% - var(--k)));border-radius:0}
html[data-cs=daun] body .card,html[data-cs=daun] body .kc,html[data-cs=daun] body .kb,html[data-cs=daun] body .rs,html[data-cs=daun] body .scg{border-radius:28px 6px 28px 6px}
html[data-cs=kapsul] body .card{border-radius:26px}
html[data-cs=kapsul] body .kc,html[data-cs=kapsul] body .kb,html[data-cs=kapsul] body .rs,html[data-cs=kapsul] body .scg{border-radius:22px}
html[data-cs=garis] body .card{background:transparent;border:2px solid var(--pac)}
html[data-cs=garis] body .kc,html[data-cs=garis] body .kb:not(.ok):not(.rj),html[data-cs=garis] body .rs:not(.ok):not(.rj),html[data-cs=garis] body .scg{background:transparent;border:2px solid var(--pac)}
html[data-cs=timbul] body .card,html[data-cs=timbul] body .kc,html[data-cs=timbul] body .kb:not(.ok):not(.rj),html[data-cs=timbul] body .rs:not(.ok):not(.rj),html[data-cs=timbul] body .scg{border-color:transparent;box-shadow:8px 8px 20px var(--psd),-8px -8px 20px var(--psl)}
/* tombol mengikuti gaya kartu */
html[data-cs=ketupat] body .tabs button,html[data-cs=ketupat] body .bar button,html[data-cs=ketupat] body .top button,html[data-cs=ketupat] body .card button{--kb:min(10px,28%);clip-path:polygon(var(--kb) 0,calc(100% - var(--kb)) 0,100% 50%,calc(100% - var(--kb)) 100%,var(--kb) 100%,0 50%);border-radius:0}
html[data-cs=potong] body .tabs button,html[data-cs=potong] body .bar button,html[data-cs=potong] body .top button,html[data-cs=potong] body .card button{--kb:min(8px,25%);clip-path:polygon(0 0,calc(100% - var(--kb)) 0,100% var(--kb),100% 100%,var(--kb) 100%,0 calc(100% - var(--kb)));border-radius:0}
html[data-cs=daun] body .tabs button,html[data-cs=daun] body .bar button,html[data-cs=daun] body .top button,html[data-cs=daun] body .card button{border-radius:14px 4px 14px 4px}
html[data-cs=kapsul] body .tabs button,html[data-cs=kapsul] body .bar button,html[data-cs=kapsul] body .top button,html[data-cs=kapsul] body .card button{border-radius:99px}
html[data-cs=tonal] body .bar button:not(.on):not(.pri),html[data-cs=tonal] body .card button:not(.on):not(.pri){background:color-mix(in srgb,var(--pac) 18%,var(--pc2));border-radius:10px}
html[data-cs=garis] body .tabs button:not(.on),html[data-cs=garis] body .bar button:not(.on):not(.pri),html[data-cs=garis] body .card button:not(.on):not(.pri){background:transparent;border:2px solid var(--pac)}
html[data-cs=timbul] body .tabs button,html[data-cs=timbul] body .bar button,html[data-cs=timbul] body .card button{border-color:transparent;box-shadow:3px 3px 8px var(--psd),-3px -3px 8px var(--psl)}
}
/* cetak: selalu kembali ke tampilan terang standar (variabel dari tema dikembalikan) */
@media print{
html{color-scheme:light!important;--bg:#fff!important;--fg:#1b1f24!important;--card:#fff!important;--mut:#667!important;--bd:#d9dde3!important;--ac:#c2410c!important;--ok:#15803d!important;--wr:#b45309!important;--er:#b91c1c!important;--row:#f3f5f8!important;--tot:#fff1d6!important;--sec:#e3eefd!important;--wk:#fafafb!important;--hi:#fde9d6!important;--tap:#fff1d6!important;--tapl:#fbdfa4!important;--okb:#dcfce7!important;--erb:#fee2e2!important;--mol:#e3eefd!important;--moll:#b9d3f7!important}
}

  RB_GRP.forEach(k=>{
    const c=LAP[k],std=c.rcs?VPRO[prodRCS]:c.std;
    const col=f=>D[k].map(z=>z?z[f]:null);
    t+=`<tr class="gh"><th class="s1">${k}<small>${k==="RCS"?esc(prodRCS):esc(c.judul.split(" - ")[1]||"")}</small></th><td colspan="${n+1}"></td></tr>`;
    t+=baris("LOI","%",col("loi"),p2);
    t+=baris("AFS",std[0]+" - "+std[1],col("afs"),a2,x=>!(x>std[0]&&x<=std[1]));
    t+=baris("PAN","maks 10%",col("pan"),p2,x=>x>0.10+1e-9);
    t+=baris("CT",c.loi?"25 - 45":"Kg/Cm&sup3;",col("ct"),c1,c.loi?(x=>x<25||x>45):null);
  });
  t+=`</tbody></table>`;
  const prodSel=`<select id="prod">${Object.keys(VPRO).map(k=>`<option${k===prodRCS?" selected":""}>${esc(k)}</option>`).join("")}</select>`;
  $("view").innerHTML=`<div class="card"><h2>RB - REPORT BULANAN &ndash; ${BLN[bulan-1]} ${tahun}</h2><div class="bar">
    <span class="chip ok">OK <b>${nOK}</b> hari</span><span class="chip${nRJ?" er":""}">REJECT <b>${nRJ}</b> hari</span><span class="sp"></span>
    <label class="mut">Standar RCS ${prodSel}</label><button id="rl">Muat ulang</button><button id="pr" title="Cetak halaman ini (A4)" aria-label="Cetak"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:5px" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7"/></svg>Cetak</button></div>
    <div class="rbw">${t}</div>
    
    ${FOOT}</div>`;
}

/* draw(keep=true): gambar ulang tanpa mengubah posisi scroll (halaman & tabel) */
function draw(keep){
  setPage();
  let sy=0,l=0,t=0,w=null;
  if(keep){sy=window.scrollY;w=document.querySelector(".rbw,.lapw");if(w){l=w.scrollLeft;t=w.scrollTop}}
  tab==="RB"?drawRB():drawLap();
  if(keep){w=document.querySelector(".rbw,.lapw");if(w){w.scrollLeft=l;w.scrollTop=t}window.scrollTo(0,sy)}
  else if(tab==="RB")scrollRB();
}
function scrollRB(){ /* pertama kali buka RB: geser ke tanggal hari ini / data terakhir (bukan tanggal 1) */
  const w=document.querySelector(".rbw");if(!w||w.scrollWidth<=w.clientWidth)return;
  let d=bulanIni()?new Date().getDate():0;
  if(!d)for(let x=jmlHari();x>=1;x--)if(getV(7,x)!==null||getV(34,x)!==null||getV(53,x)!==null||getV(67,x)!==null){d=x;break}
  const th=w.querySelector("thead th:nth-child("+((d||1)+1)+")");
  if(th)w.scrollLeft=Math.max(0,th.offsetLeft-w.clientWidth/2);
}

/* ---------- Data: 1 bulan penuh per tabel, disimpan di memori (pindah tab = tanpa unduh) ---------- */
function unitsNeed(){const ids=BUTUH[tab]||[tab],u=ids.slice();if(LAP[tab]&&!ids.includes("AT"))u.push("A7");return u}
async function ambilUnit(u,y,m){
  const id=u==="A7"?"AT":u,q=`tahun=eq.${y}&bulan=eq.${m}&tabid=eq.${id}`;
  const jobs=[ambil(`nilai?select=r,hari,nilai&${q}&nilai=not.is.null${u==="A7"?"&r=eq.7&limit=100":"&limit=1000"}`)];
  if(u==="RC")jobs.push(ambil(`keterangan?select=hari,teks&${q}&teks=not.is.null&limit=1000`));
  const [a,b]=await Promise.all(jobs),v={},k={};
  a.forEach(x=>{(v[x.r]=v[x.r]||{})[x.hari]=x.nilai});
  if(b)b.forEach(x=>{k[x.hari]=x.teks});
  return {v,k,s:JSON.stringify(a)+(b?JSON.stringify(b):""),ts:Date.now()};
}
function rakit(per,need){ /* gabung data unit yang dibutuhkan tab aktif (nomor baris unik antar tabel) */
  let sg="";vals={};kets={};
  need.forEach(u=>{const e=DATA[per+"|"+u];if(!e)return;for(const r in e.v)vals[r]=e.v[r];if(u==="RC")kets=e.k;sg+=e.s});
  return sg;
}
function formAktif(){const a=document.activeElement;return !!(a&&a.tagName==="SELECT"&&$("view").contains(a))}
async function muat(quiet,paksa){
  const y=tahun,m=bulan,per=y+"-"+m,t0=tab,need=unitsNeed();
  const cur=bulanIni()||(y===awalT&&m===awalB);
  if(quiet&&!cur)return;
  const miss=need.filter(u=>quiet||paksa||!DATA[per+"|"+u]);
  if(!miss.length){ /* semua sudah ada di memori: tampil langsung */
    drawnSig=rakit(per,need);draw(false);
    if(cur&&need.some(u=>Date.now()-DATA[per+"|"+u].ts>30000))muat(true);
    else setStatus("Diperbarui "+jam(),"ok");
    prefetch();
    return;
  }
  if(!quiet)setStatus("Memuat…","");
  try{
    const rs=await Promise.all(miss.map(u=>ambilUnit(u,y,m)));
    miss.forEach((u,i)=>{DATA[per+"|"+u]=rs[i]});
    if(per!==tahun+"-"+bulan||t0!==tab)return; /* pengguna sudah pindah */
    const sg=rakit(per,need);
    if(quiet&&!paksa){
      if(sg===drawnSig){setStatus("Diperbarui "+jam(),"ok");return} /* data sama: tidak gambar ulang */
      if(formAktif())return;
    }
    drawnSig=sg;draw(quiet||paksa);setStatus("Diperbarui "+jam(),"ok");
    prefetch();
  }catch(e){setStatus("Gagal memuat: "+e.message,"er")}
}
function prefetch(){ /* saat browser menganggur: unduh tabel lain agar pindah tab instan */
  const my=++pfTok,y=tahun,m=bulan,per=y+"-"+m;
  const idle=f=>window.requestIdleCallback?requestIdleCallback(f,{timeout:3000}):setTimeout(f,400);
  const step=async()=>{
    if(my!==pfTok||!siap)return;
    const u=["AT","RC","ML","CN"].find(x=>!DATA[per+"|"+x]);
    if(!u)return;
    try{const d=await ambilUnit(u,y,m);if(my!==pfTok)return;DATA[per+"|"+u]=d}catch(e){return}
    idle(step);
  };
  idle(step);
}
function markTab(){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));const a=document.querySelector("#tabs .on");if(a)a.scrollIntoView({inline:"center",block:"nearest"})}
function drawTabs(){$("tabs").innerHTML=SEMUA_TAB.map(t=>`<button class="${t.id===tab?"on":""}" data-t="${t.id}">${t.l}</button>`).join("");const a=document.querySelector("#tabs .on");if(a)a.scrollIntoView({inline:"center",block:"nearest"})}
function isiPeriode(){
  const b=$("bln"),y=$("thn");
  b.innerHTML=BLN.map((n,i)=>`<option value="${i+1}">${n}</option>`).join("");
  let o="";for(let i=Math.min(2024,tahun-1);i<=Math.max(2035,tahun+1);i++)o+=`<option>${i}</option>`;
  y.innerHTML=o;b.value=bulan;y.value=tahun;
}
function geser(n){
  tgl=0;bulan+=n;
  if(bulan<1){bulan=12;tahun--}else if(bulan>12){bulan=1;tahun++}
  isiPeriode();muat();
}
function tampilLogin(pesan){
  siap=false;
  $("out").style.display="none";
  $("tabs").innerHTML="";
  $("view").innerHTML=`<div class="card" id="login"><h2>Login</h2><p class="mut">Gunakan akun yang sama dengan COPAS.</p>
    <input class="tx" id="em" type="email" placeholder="Email" autocomplete="username">
    <input class="tx" id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="pri" id="go" style="width:100%">Masuk</button><p class="mut" id="lm">${esc(pesan||"")}</p></div>`;
  setStatus("Belum login","");
}
async function mulai(){
  /* Sesi dipakai bersama COPAS (kunci kom_sb). Belum login -> tampilkan form masuk. */
  $("out").style.display="none";
  if(!sess){tampilLogin("");return}
  if(!SEMUA_TAB.some(t=>t.id===tab))tab="MA";
  const n=new Date();
  setStatus("Memuat…","");
  try{
    const l=await ambil("nilai?select=tahun,bulan&nilai=not.is.null&order=tahun.desc,bulan.desc&limit=1");
    if(!l||!l.length){
      tahun=n.getFullYear();bulan=n.getMonth()+1;
    }else{tahun=l[0].tahun;bulan=l[0].bulan}
  }catch(e){
    if(!sess){tampilLogin(e.message);return}
    tahun=n.getFullYear();bulan=n.getMonth()+1;
  }
  awalT=tahun;awalB=bulan;siap=true;isiPeriode();drawTabs();muat();
}

document.addEventListener("change",e=>{
  if(e.target.id==="bln"||e.target.id==="thn"){tgl=0;bulan=+$("bln").value;tahun=+$("thn").value;muat()}
  else if(e.target.id==="tgl"){tgl=+e.target.value;draw(true)}
  else if(e.target.id==="prod"){prodRCS=e.target.value;draw(true)}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="pw"||e.target.id==="em"))$("go").click()});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-t]");
  if(b){if(b.dataset.t===tab)return;tab=b.dataset.t;try{history.replaceState(null,"","#"+tab)}catch(x){}markTab();muat();return}
  if(e.target.id==="prev"){if(siap)geser(-1);return}
  if(e.target.id==="next"){if(siap)geser(1);return}
  if(e.target.id==="rl"){muat(false,true);return}
  {const pb=e.target.closest("button[id]");if(pb&&(pb.id==="pr"||pb.id==="pr2")){cetakA4();return}}
  if(e.target.id==="out"){keluar();return}
  if(e.target.id==="go"){
    const lm=$("lm");lm.textContent="Masuk…";
    try{await authCall("password",{email:$("em").value.trim(),password:$("pw").value});mulai()}
    catch(err){lm.textContent="Gagal: "+err.message}
    return;
  }
});
setInterval(()=>{if(siap&&!document.hidden)muat(true)},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&siap)muat(true)});

/* satu login dengan COPAS dan INPUT.html (kunci kom_sb): ikut berubah saat login/keluar di halaman lain */
addEventListener("storage",e=>{if(e.key!==null&&e.key!==SESS_KEY)return;const had=sess?sess.access:null;
  sess=bacaSess();
  const now=sess?sess.access:null;if(now===had)return;
  DATA={};pfTok++;mulai()});
mulai();
</script></body></html>
