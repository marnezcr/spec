 // ---- data -> format COPAS (QRList / QRData) ----
 function conv(r){const x=w2ser(r.waktu);if(x==null)return null;const f=Math.floor(x);
  // SampIndex pada format COPAS berbentuk "Sample No.(NAMA ...spasi...)" selebar 45 karakter.
  // Rumus kode di lembar DB membaca posisi karakter, jadi bentuk aslinya dikembalikan persis.
  return{SeqNo:r.id,AgName:r.agname||"",SampIndex:"Sample No.("+String(r.nama||"").padEnd(45)+")",AnaDate:f,AnaTime:x-f}}
 function merge(rows){let ch=false;for(const r of rows){const o=S.rows.get(r.id);
   if(!o||o.waktu!==r.waktu||o.agname!==r.agname||o.nama!==r.nama||JSON.stringify(o.nilai)!==JSON.stringify(r.nilai)){S.rows.set(r.id,r);ch=true}}return ch}
 function apply(){
  const ql=[],qd=[];
  for(const r of S.rows.values()){const o=conv(r);if(!o)continue;ql.push(o);const v=r.nilai||{};for(const k in v)qd.push({SeqNo:o.SeqNo,DispEle:k,Content:String(v[k])})}
  setData({QRList:ql,QRData:qd});
  if(S.min!=null){DMIN=S.min;DMAX=S.max}
  HASDATA=true;
  say("Supabase: "+ql.length+" sampel dimuat · tampil "+DBN+" · "+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+(S.sess&&S.sess.m?" · "+S.sess.m:"")+(S.err?" · ⚠ "+S.err:""));
  draw()}

 // ---- rentang yang dibutuhkan tampilan saat ini ----
 function need(){const r=[[FLT.a,FLT.b,""]];
  const mo=(M,f)=>[pdSer(M.y,M.m),pdSer(M.y,M.m+1),f];
  if(TAB==='pd')r.push(mo(PDM,"pd"));else if(TAB==='scb')r.push(mo(SCBM,"scb"));else if(TAB==='xbb')r.push(mo(XBBM,"xbb"));return r}
 // bagian rentang [a,b) yang belum dimuat; muatan penuh ("") sudah mencakup muatan tersaring
 function missing(a,b,f){let segs=[[a,b]];
  for(const[x,y,g]of S.loaded){if(g!==""&&g!==f)continue;const n=[];for(const[p,q]of segs){if(y<=p||x>=q){n.push([p,q]);continue}if(x>p)n.push([p,x]);if(y<q)n.push([y,q])}segs=n}
  return segs.filter(s=>s[1]-s[0]>1e-9)}
 // batasi memori: kalau terlalu banyak, buang data di luar rentang yang sedang dipakai
 function prune(){
  const nd=need(),keep=[];
  for(const[id,r]of S.rows){const x=w2ser(r.waktu);if(!(S.newest.has(id)||nd.some(n=>x>=n[0]&&x<n[1])))S.rows.delete(id)}
  for(const[x,y,g]of S.loaded)for(const[a,b,f]of nd){if(g!==""&&g!==f)continue;const p=Math.max(x,a),q=Math.min(y,b);if(q>p)keep.push([p,q,g])}
  S.loaded=keep}
 async function ensure(){
  if(!S.sess||!S.started)return;
  if(S.busy){S.again=true;return}
  S.busy=true;
  try{
   do{S.again=false;
    if(S.rows.size>MAXROWS)prune();
    const segs=[];for(const n of need())for(const m of missing(n[0],n[1],n[2]))segs.push([m[0],m[1],n[2]]);
    if(!segs.length)break;
    say("Memuat data dari Supabase…");
    for(const[a,b,f]of segs){merge(await qAll(rng(a,b)+FIL[f]));S.loaded.push([a,b,f])}
    S.err="";apply();
   }while(S.again)
  }catch(e){fail(e)}finally{S.busy=false}}
 function fail(e){
  if(e.message==="AUTH"){showLogin("Sesi berakhir, silakan login lagi.");return}
  S.err=e instanceof TypeError?"tidak ada koneksi":e.message;say("DATABASE : "+S.err)}

 async function start(){
  S.started=true;S.loaded=[];S.busy=true;
  try{
   const r1=await req("select=waktu&order=waktu.asc&limit=1",{Prefer:"count=exact"});
   const m=/\/(\d+)$/.exec(r1.headers.get("content-range")||"");SBTOT=m?+m[1]:null;
   const a=await r1.json(),b=await(await req(SEL+"&order=waktu.desc,id.desc&limit=20")).json();
   S.min=a.length?w2ser(a[0].waktu):null;S.max=b.length?w2ser(b[0].waktu):null;
   merge(b);S.newest=new Set(b.map(r=>r.id));S.err="";
   const segs=[];for(const n of need())for(const m of missing(n[0],n[1],n[2]))segs.push([m[0],m[1],n[2]]);
   for(const[x,y,f]of segs){merge(await qAll(rng(x,y)+FIL[f]));S.loaded.push([x,y,f])}
   apply()
  }catch(e){fail(e)}finally{S.busy=false}}

 // ---- Live: ambil sampel terbaru tiap 5 detik ----
 let POLL=null;
 async function poll(){
  if(!S.sess||!S.started||S.busy||document.hidden||typeof AR==='undefined'||!AR||editing())return;
  try{
   const rows=await(await req(SEL+"&order=waktu.desc,id.desc&limit=10")).json();
   const before=S.rows.size;
   rows.forEach(r=>S.newest.add(r.id));
   if(merge(rows)){
    const x=rows.length?w2ser(rows[0].waktu):null;if(x!=null&&(S.max==null||x>S.max))S.max=x;
    if(S.rows.size>before&&SBTOT!=null)SBTOT+=S.rows.size-before;
    S.err="";apply()}
   else if(S.err){S.err="";say($('#st').textContent.replace(/ · ⚠.*$/,""))}
  }catch(e){fail(e)}}

 // ---- layar login ----
 function showLogin(msg){E("sbo").hidden=false;E("sb_er").textContent=msg||"";if(!S.foc){S.foc=true;setTimeout(()=>E("sb_em").focus(),50)}}
 function hideLogin(){E("sbo").hidden=true;S.foc=false}
 async function doLogin(){
  const em=E("sb_em").value.trim(),pw=E("sb_pw").value;
  if(!em||!pw){E("sb_er").textContent="Isi email dan password.";return}
  E("sb_er").textContent="Memeriksa…";
  try{S.sess=null;saveSess(await auth("password",{email:em,password:pw}));E("sb_pw").value="";hideLogin();S.rows.clear();start()}
  catch(e){E("sb_er").textContent=e instanceof TypeError?"Tidak ada koneksi internet.":/invalid|credentials/i.test(e.message)?"Email atau password salah.":("Gagal: "+e.message)}}
 function logout(){dropSess();wipe()}
 function wipe(){S.rows.clear();S.loaded=[];S.started=false;SBTOT=null;S.min=S.max=null;
  setData({QRList:[],QRData:[]});HASDATA=false;say("Belum login.");draw();showLogin("")}
 // satu sesi: logout/login dari index.html (atau tab lain) langsung ikut berlaku di sini
 window.addEventListener("storage",e=>{if(e.key!==null&&e.key!=="kom_sb")return;const had=!!S.sess;loadSess();if(!S.sess){if(had||S.started)wipe()}else if(!had){hideLogin();S.rows.clear();start()}});
 function connect(){
  E("sb_go").onclick=doLogin;E("sb_em").onkeydown=E("sb_pw").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();doLogin()}};
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
  clearInterval(POLL);POLL=setInterval(poll,5000);
  loadSess();if(!S.sess){say("Belum login.");showLogin("");return}
  hideLogin();say("Menghubungkan ke Supabase…");start()}
 function reload(){if(!S.sess){showLogin("");return}S.rows.clear();S.loaded=[];start()}

 // setiap kali tampilan / filter berubah, pastikan rentang waktunya sudah dimuat
 let KT=null;const kick=()=>{clearTimeout(KT);KT=setTimeout(ensure,0)};
 const _rb=rebuildDB;rebuildDB=function(){_rb.apply(this,arguments);kick()};
 const _dr=draw;draw=function(){_dr.apply(this,arguments);kick()};
 window.SBC={connect,reload,logout};
})();
</script></body></html>
