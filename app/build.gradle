plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spectro.online'
    compileSdk 34

    defaultConfig {
        applicationId "com.spectro.online"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// Tanpa dependensi apa pun (tidak butuh AndroidX / Capacitor).
